<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Event Handler</h1>

    <h2 id="title">This is Event Handler</h2>

    <br />

    <button id="btn-update-title">update title</button>

    <div>
      <input type="text" id="input-name" />

      <button id="btn-change-value">change value</button>

      <h3 id="name">Name:</h3>
    </div>

    <script>
      const btnUpdate = document.getElementById("btn-update-title");

      btnUpdate.addEventListener("click", function () {
        let title = document.getElementById("title");

        title.innerText = "Updated title: Hello Event Handler";
        // title.textContent += " - Updated title: Hello Event Handler";
        console.log("Updated");
      });

      //   input change

      const btnChange = document.getElementById("btn-change-value");

      btnChange.addEventListener("click", function () {
        // get the element nameInput
        const nameInput = document.getElementById("input-name");
        console.log(nameInput);

        const name = nameInput.value;
        console.log("name:", name);

        const nameP = document.getElementById("name");
        nameP.innerText += " " + name;
      });
    </script>

    <script src="./js/handler.js"></script>
  </body>
</html>
