<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Event</title>
  </head>
  <body>
    <h1>JS Dom Event</h1>

    <!-- onclick -->
    <button onclick="alert('I am Clicked')">Click Me</button>

    <button id="btn-blue">Make Blue</button>

    <button id="btn-green">Make Green</button>

    <button id="btn-gold">Make Gold</button>

    <script>
      // option 1
      const btnBlue = document.getElementById("btn-blue");

      btnBlue.onclick = function () {
        document.body.style.backgroundColor = "blue";
        console.log("Change into Blue");
      };

      //   option 2
      const btnGreen = document.getElementById("btn-green");

      btnGreen.addEventListener("click", function () {
        document.body.style.backgroundColor = "green";
        console.log("Change into Green");
      });

      //   option 3
      const btnGold = document.getElementById("btn-gold");

      btnGold.addEventListener("mouseover", function () {
        document.body.style.backgroundColor = "gold";
        console.log("Mouse Over");
      });

      btnGold.addEventListener("mouseenter", function () {
        document.body.style.backgroundColor = "gray";
        console.log("Mouse Enter");
      });

      btnGold.addEventListener("mouseleave", function () {
        document.body.style.backgroundColor = "white";
        console.log("Mouse leave");
      });
    </script>

    <script src="./js/event.js"></script>
  </body>
</html>
